# Render Blueprint: one-click deploy of the Node server (UI + API).
services:
  - type: web
    name: tastebridge-groups
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false        # paste your Qloo key in the Render dashboard; leave empty for SAMPLE DATA mode
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: ANTHROPIC_API_KEY
        sync: false        # optional
      - key: NODE_VERSION
        value: 20
